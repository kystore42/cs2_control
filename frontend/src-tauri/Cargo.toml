[package]
name = "cs2-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "cs2_core"
path = "src/lib.rs"

[[bin]]
name = "cs2-core"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
winreg = "0.52"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
